[project]
name = "crisis-data"
version = "0.1.0"
description = "Conflict-market staple price panel for Sudan and Yemen (WFP, FEWS NET, REACH JMMI)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "openpyxl>=3.1",
    "rapidfuzz>=3.9",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.9",
    "requests>=2.32",
    "pyyaml>=6.0",
    "pdfplumber>=0.11.10",
]

[project.scripts]
crisis-data = "crisis_data.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crisis_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs a fetched raw snapshot under data/raw"]
